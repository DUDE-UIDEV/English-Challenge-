<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متتبع تحدي المهارات البسيط</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        /* الألوان والخطوط الأساسية */
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #1a202c; /* خلفية داكنة */
            color: #e2e8f0; /* نص فاتح */
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .card {
            background-color: #2d3748; /* لون بطاقة داكن */
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 1px solid #4a5568;
        }
        h1, h2, h3 {
            color: #4299e1; /* لون أزرق للرؤوس */
            text-align: right;
            border-bottom: 2px solid #4a5568;
            padding-bottom: 5px;
            margin-top: 0;
        }
        
        /* الأزرار والحقول */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }
        .btn-primary {
            background-color: #4299e1; /* أزرق أساسي */
            color: white;
        }
        .btn-primary:hover {
            background-color: #3182ce;
        }
        .btn-logout {
            background-color: #e53e3e; /* أحمر للخروج */
            color: white;
        }
        .btn-logout:hover {
            background-color: #c53030;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            background-color: #4a5568;
            border: 1px solid #718096;
            border-radius: 6px;
            color: white;
            text-align: right;
        }
        .user-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .user-btn {
            flex-grow: 1;
            padding: 30px;
            font-size: 1.8rem;
            border-radius: 10px;
            color: white;
            box-shadow: 0 5px #1a202c;
        }
        #ala-select { background-color: #3182ce; } /* أزرق */
        #mahmoud-select { background-color: #9f7aea; } /* بنفسجي */

        /* التقدم والمؤشرات */
        .progress-bar-container {
            background-color: #4a5568;
            border-radius: 10px;
            height: 20px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            transition: width 0.5s;
            text-align: left;
            padding-right: 5px;
            font-size: 0.8rem;
            line-height: 20px;
            color: white;
        }
        .progress-complete {
            background-color: #48bb78; /* أخضر للإكمال */
        }
        .progress-incomplete {
            background-color: #f6ad55; /* برتقالي لغير المكتمل */
        }
        .stat-box {
            background-color: #4a5568;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            margin-top: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .daily-winner {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .winner-ala { color: #4299e1; }
        .winner-mahmoud { color: #9f7aea; }
        .winner-tie { color: #ecc94b; }

    </style>
</head>
<body>

    <div id="app" class="container">
        </div>

    <script>
        // --- 1. الإعدادات والثوابت ---
        const TARGET_MINUTES = 20;
        const SKILL_COUNT = 3;
        const TOTAL_DAILY_TARGET = TARGET_MINUTES * SKILL_COUNT;

        const USER_DATA = {
            ala: { name: 'الاء', color: '#4299e1' },
            mahmoud: { name: 'محمود', color: '#9f7aea' }
        };
        const SKILL_NAMES_AR = {
            speaking: 'التحدث',
            pronunciation: 'النطق',
            listening: 'الاستماع',
        };
        const STORAGE_KEY = 'challenge_logs';

        // --- 2. أدوات مساعدة ---
        const getISODate = (date = new Date()) => {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const loadLogs = () => {
            const logs = localStorage.getItem(STORAGE_KEY);
            return logs ? JSON.parse(logs) : {};
        };

        const saveLogs = (logs) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        };

        const calculatePerformance = (logs, userId) => {
            const today = getISODate();
            let completedDays = 0;
            let currentStreak = 0;
            let longestStreak = 0;
            
            // تحويل السجل إلى مصفوفة بيانات لسهولة المعالجة
            const userDays = Object.entries(logs)
                .filter(([date, data]) => data[userId])
                .map(([date, data]) => ({ date, log: data[userId] }))
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            // حساب السلسلة (Streak)
            let lastCompletedDate = null;
            userDays.forEach(day => {
                if (day.log.isCompleted) {
                    completedDays++;
                    const currentDate = new Date(day.date);
                    
                    if (lastCompletedDate) {
                        const timeDiff = currentDate.getTime() - lastCompletedDate.getTime();
                        const dayDiff = Math.round(timeDiff / (1000 * 60 * 60 * 24));
                        
                        if (dayDiff === 1) {
                            currentStreak++;
                        } else if (dayDiff > 1) {
                            currentStreak = 1;
                        }
                    } else {
                        currentStreak = 1;
                    }
                    longestStreak = Math.max(longestStreak, currentStreak);
                    lastCompletedDate = currentDate;
                }
            });
            
            // حساب معدل الإكمال الشهري (تقريبي)
            const todayDate = new Date();
            const startOfMonth = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
            const daysInMonth = Math.floor((todayDate - startOfMonth) / (1000 * 60 * 60 * 24)) + 1;
            const monthlyCompletionRate = daysInMonth > 0 ? (completedDays / daysInMonth) * 100 : 0;
            
            return {
                monthlyCompletionRate: monthlyCompletionRate.toFixed(1),
                currentStreak,
                longestStreak
            };
        };

        const getDailyWinner = (dayLog) => {
            const ala = dayLog['ala'];
            const mahmoud = dayLog['mahmoud'];

            if (!ala && !mahmoud) return null;

            // 1. الأولوية للإكمال (60 دقيقة)
            const alaCompleted = ala?.isCompleted || false;
            const mahmoudCompleted = mahmoud?.isCompleted || false;

            if (alaCompleted && !mahmoudCompleted) return 'ala';
            if (!alaCompleted && mahmoudCompleted) return 'mahmoud';

            // 2. إذا تساوت حالة الإكمال، ننظر للدقائق الإجمالية
            const alaMinutes = ala?.totalMinutes || 0;
            const mahmoudMinutes = mahmoud?.totalMinutes || 0;

            if (alaMinutes > mahmoudMinutes) return 'ala';
            if (mahmoudMinutes > alaMinutes) return 'mahmoud';

            // 3. تعادل
            if (alaMinutes > 0 || mahmoudMinutes > 0) return 'tie';
            
            return null;
        };

        // --- 3. إدارة حالة التطبيق ---
        let logs = loadLogs();
        let currentUser = localStorage.getItem('current_user') || null;
        let currentPage = 'dashboard';
        const appDiv = document.getElementById('app');

        // --- 4. وظائف العرض (Rendering) ---

        function renderApp() {
            if (!currentUser) {
                renderLoginScreen();
            } else {
                renderMainContent();
            }
        }

        // شاشة الدخول
        function renderLoginScreen() {
            appDiv.innerHTML = `
                <div class="card" style="max-width: 400px; margin: 100px auto;">
                    <h2 style="text-align: center;">اختر حسابك لبدء التسجيل</h2>
                    <div class="user-selector">
                        <button id="ala-select" class="user-btn" data-user="ala">${USER_DATA.ala.name}</button>
                        <button id="mahmoud-select" class="user-btn" data-user="mahmoud">${USER_DATA.mahmoud.name}</button>
                    </div>
                </div>
            `;
            document.querySelectorAll('.user-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    currentUser = e.target.dataset.user;
                    localStorage.setItem('current_user', currentUser);
                    renderApp();
                });
            });
        }
        
        // الواجهة الرئيسية
        function renderMainContent() {
            const userName = USER_DATA[currentUser].name;
            appDiv.innerHTML = `
                <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h1>متتبع تحدي ${userName}</h1>
                    <button id="logout-btn" class="btn btn-logout">تسجيل الخروج</button>
                </header>
                
                <nav class="card" style="background-color: #1a202c; padding: 10px;">
                    <button class="btn ${currentPage === 'dashboard' ? 'btn-primary' : ''}" onclick="changePage('dashboard')">لوحة تحكم ${userName}</button>
                    <button class="btn ${currentPage === 'comparison' ? 'btn-primary' : ''}" onclick="changePage('comparison')">المقارنة</button>
                </nav>
                
                <div id="page-content"></div>
            `;
            
            document.getElementById('logout-btn').addEventListener('click', () => {
                currentUser = null;
                localStorage.removeItem('current_user');
                renderApp();
            });

            if (currentPage === 'dashboard') {
                renderDashboard();
            } else {
                renderComparisonPage();
            }
        }

        function changePage(page) {
            currentPage = page;
            renderMainContent();
        }

        // لوحة التحكم (Dashboard)
        function renderDashboard() {
            const today = getISODate();
            const todayLog = logs[today]?.[currentUser] || { skills: { speaking: 0, pronunciation: 0, listening: 0 }, totalMinutes: 0, isCompleted: false, note: '' };
            const { monthlyCompletionRate, currentStreak, longestStreak } = calculatePerformance(logs, currentUser);
            
            const contentDiv = document.getElementById('page-content');
            contentDiv.innerHTML = `
                <div class="card">
                    <h2>الحالة اليومية</h2>
                    <p style="font-size: 1.5rem; font-weight: bold; color: ${todayLog.isCompleted ? '#48bb78' : '#e53e3e'};">
                        ${todayLog.isCompleted ? 'مُكتملة لهذا اليوم! 🎉' : 'لم تكتمل بعد'}
                    </p>
                    <p>الإجمالي المسجل: ${todayLog.totalMinutes} / ${TOTAL_DAILY_TARGET} دقيقة</p>
                    <button id="open-log-form" class="btn btn-primary" style="margin-top: 10px;">
                        ${todayLog.totalMinutes > 0 ? 'تحديث السجل' : 'تسجيل التقدم'}
                    </button>
                </div>

                <div class="grid">
                    <div class="card stat-box">
                        <h3>السلسلة الحالية (أيام)</h3>
                        <p class="stat-value" style="color: #4299e1;">${currentStreak}</p>
                    </div>
                    <div class="card stat-box">
                        <h3>أطول سلسلة (أيام)</h3>
                        <p class="stat-value" style="color: #9f7aea;">${longestStreak}</p>
                    </div>
                    <div class="card stat-box">
                        <h3>إكمال الشهر</h3>
                        <p class="stat-value" style="color: #48bb78;">${monthlyCompletionRate}%</p>
                    </div>
                </div>

                <div class="card">
                    <h2>تفاصيل الدقائق لكل مهارة (هدف ${TARGET_MINUTES} دقيقة)</h2>
                    ${Object.keys(SKILL_NAMES_AR).map(skill => 
                        renderProgressBar(SKILL_NAMES_AR[skill], todayLog.skills[skill] || 0)
                    ).join('')}

                    ${todayLog.note ? `<div style="margin-top: 15px; border-top: 1px solid #4a5568; padding-top: 10px;">
                        <strong>ملاحظة اليوم:</strong> <em>${todayLog.note}</em>
                    </div>` : ''}
                </div>
            `;
            document.getElementById('open-log-form').addEventListener('click', renderLoggingForm);
        }

        function renderProgressBar(label, current) {
            const percentage = Math.min(100, (current / TARGET_MINUTES) * 100);
            const color = current >= TARGET_MINUTES ? '#48bb78' : '#f6ad55';
            
            return `
                <div style="margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                        <span>${label}</span>
                        <span>${current}/${TARGET_MINUTES} دقيقة</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${percentage}%; background-color: ${color};">
                           ${current}د
                        </div>
                    </div>
                </div>
            `;
        }
        
        // نموذج تسجيل الدقائق
        function renderLoggingForm() {
            const today = getISODate();
            const todayLog = logs[today]?.[currentUser] || { skills: { speaking: 0, pronunciation: 0, listening: 0 }, note: '' };
            
            // نستخدم نموذج بدلاً من مودال معقد
            const contentDiv = document.getElementById('page-content');
            contentDiv.innerHTML = `
                <div class="card" id="log-form-card">
                    <h2>تسجيل تقدم ${USER_DATA[currentUser].name} لليوم</h2>
                    <form id="challenge-form">
                        ${Object.keys(SKILL_NAMES_AR).map(skill => `
                            <div>
                                <label for="${skill}">${SKILL_NAMES_AR[skill]} (بالدقائق)</label>
                                <input type="number" id="${skill}" name="${skill}" class="input-field" min="0" value="${todayLog.skills[skill] || 0}" required>
                            </div>
                        `).join('')}
                        
                        <div>
                            <label for="note">ملاحظات اليوم (اختياري)</label>
                            <textarea id="note" name="note" class="input-field" rows="3">${todayLog.note}</textarea>
                        </div>
                        
                        <div style="display: flex; justify-content: flex-start; margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">حفظ التقدم</button>
                            <button type="button" class="btn" onclick="renderMainContent()">إلغاء</button>
                        </div>
                        <p id="form-message" style="margin-top: 10px;"></p>
                    </form>
                </div>
            `;

            document.getElementById('challenge-form').addEventListener('submit', handleLogSubmit);
        }

        // صفحة المقارنة
        function renderComparisonPage() {
            const today = getISODate();
            const todayLog = logs[today] || {};
            const winner = getDailyWinner(todayLog);
            const contentDiv = document.getElementById('page-content');
            
            let winnerMessage = '';
            let winnerClass = '';

            if (winner === 'ala') {
                winnerMessage = `${USER_DATA.ala.name} يفوز اليوم! 🎉`;
                winnerClass = 'winner-ala';
            } else if (winner === 'mahmoud') {
                winnerMessage = `${USER_DATA.mahmoud.name} يفوز اليوم! 🏆`;
                winnerClass = 'winner-mahmoud';
            } else if (winner === 'tie') {
                winnerMessage = 'تعادل في التقدم اليوم! 🤝';
                winnerClass = 'winner-tie';
            } else {
                winnerMessage = 'لم يتم تسجيل تقدم اليوم بعد.';
                winnerClass = '';
            }

            // حساب الإجمالي الشهري
            let alaWins = 0;
            let mahmoudWins = 0;
            let totalDays = 0;
            
            Object.values(logs).forEach(dayLog => {
                const dailyWinner = getDailyWinner(dayLog);
                if (dailyWinner === 'ala') alaWins++;
                if (dailyWinner === 'mahmoud') mahmoudWins++;
                if (dayLog.ala || dayLog.mahmoud) totalDays++;
            });

            contentDiv.innerHTML = `
                <div class="card daily-winner ${winnerClass}">
                    <h2>نتيجة اليوم:</h2>
                    <p>${winnerMessage}</p>
                    <p style="font-size: 1rem; color: #a0aec0;">
                       (من يفوز بالإكمال أولاً، أو يسجل دقائق أكثر)
                    </p>
                </div>

                <div class="grid">
                    <div class="card stat-box">
                        <h3>فوز ${USER_DATA.ala.name} (شهري)</h3>
                        <p class="stat-value" style="color: ${USER_DATA.ala.color};">${alaWins}</p>
                    </div>
                    <div class="card stat-box">
                        <h3>فوز ${USER_DATA.mahmoud.name} (شهري)</h3>
                        <p class="stat-value" style="color: ${USER_DATA.mahmoud.color};">${mahmoudWins}</p>
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h2>الجدول الزمني الشهري</h2>
                    <div style="overflow-x: auto; padding-bottom: 10px;">
                        <table style="width: 100%; min-width: 600px; border-collapse: collapse; text-align: center;">
                            <thead>
                                <tr style="background-color: #4a5568;">
                                    <th style="padding: 10px; border: 1px solid #718096;">اليوم</th>
                                    <th style="padding: 10px; border: 1px solid #718096;">حالة ${USER_DATA.ala.name}</th>
                                    <th style="padding: 10px; border: 1px solid #718096;">حالة ${USER_DATA.mahmoud.name}</th>
                                    <th style="padding: 10px; border: 1px solid #718096;">الفائز</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${renderMonthlyTimelineTable()}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderMonthlyTimelineTable() {
            const allDates = Object.keys(logs).sort().reverse(); // الأحدث أولاً

            return allDates.map(date => {
                const dayLog = logs[date];
                const ala = dayLog['ala'] || { totalMinutes: 0, isCompleted: false };
                const mahmoud = dayLog['mahmoud'] || { totalMinutes: 0, isCompleted: false };
                const winner = getDailyWinner(dayLog);
                
                let winnerName = '---';
                let winnerColor = '#e2e8f0';

                if (winner === 'ala') {
                    winnerName = USER_DATA.ala.name;
                    winnerColor = USER_DATA.ala.color;
                } else if (winner === 'mahmoud') {
                    winnerName = USER_DATA.mahmoud.name;
                    winnerColor = USER_DATA.mahmoud.color;
                } else if (winner === 'tie') {
                    winnerName = 'تعادل';
                    winnerColor = '#ecc94b';
                }

                const formatStatus = (log) => {
                    const statusText = log.isCompleted ? 'مكتمل ✅' : 'غير مكتمل ❌';
                    const minutesText = log.totalMinutes > 0 ? `(${log.totalMinutes} د)` : '';
                    const color = log.isCompleted ? '#48bb78' : '#e53e3e';
                    return `<span style="color: ${color};">${statusText}</span> ${minutesText}`;
                };
                
                return `
                    <tr style="border-top: 1px solid #4a5568;">
                        <td style="padding: 10px; border: 1px solid #4a5568;">${date}</td>
                        <td style="padding: 10px; border: 1px solid #4a5568;">${formatStatus(ala)}</td>
                        <td style="padding: 10px; border: 1px solid #4a5568;">${formatStatus(mahmoud)}</td>
                        <td style="padding: 10px; border: 1px solid #4a5568;"><span style="color: ${winnerColor}; font-weight: bold;">${winnerName}</span></td>
                    </tr>
                `;
            }).join('');
        }

        // --- 5. منطق التعامل مع البيانات ---

        function handleLogSubmit(e) {
            e.preventDefault();
            const today = getISODate();
            const form = e.target;
            const messageEl = document.getElementById('form-message');
            messageEl.style.color = 'white';
            messageEl.textContent = 'جارٍ الحفظ...';

            let totalMinutes = 0;
            const skills = {};
            
            Object.keys(SKILL_NAMES_AR).forEach(skill => {
                const minutes = parseInt(form[skill].value) || 0;
                skills[skill] = minutes;
                totalMinutes += minutes;
            });
            
            const note = form.note.value.trim();
            const isCompleted = totalMinutes >= TOTAL_DAILY_TARGET && 
                                skills.speaking >= TARGET_MINUTES && 
                                skills.pronunciation >= TARGET_MINUTES && 
                                skills.listening >= TARGET_MINUTES;

            // تحديث السجل المحلي
            if (!logs[today]) {
                logs[today] = {};
            }
            logs[today][currentUser] = {
                skills: skills,
                totalMinutes: totalMinutes,
                isCompleted: isCompleted,
                note: note,
                timestamp: new Date().toISOString()
            };
            
            saveLogs(logs);

            messageEl.textContent = '✅ تم حفظ التقدم بنجاح!';
            messageEl.style.color = '#48bb78';
            
            // العودة إلى لوحة التحكم بعد 1.5 ثانية
            setTimeout(renderMainContent, 1500);
        }

        // --- 6. بدء التطبيق ---
        renderApp();
    </script>
</body>
</html>
